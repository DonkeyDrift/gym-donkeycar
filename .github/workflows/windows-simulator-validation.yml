name: Windows simulator validation

on:
  push:
    branches:
      - Tony-windows-simulator-validation
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Download validation package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          gh release download windows-simulator-validation `
            --repo DonkeyDrift/gym-donkeycar `
            --pattern "DonkeySimWin-update-button-v25.10.06.zip" `
            --dir package
          if ((Get-Item "package/DonkeySimWin-update-button-v25.10.06.zip").Length -eq 0) {
            throw "downloaded package is empty"
          }

      - name: Expand validation package
        shell: pwsh
        run: |
          Expand-Archive -Path "package/DonkeySimWin-update-button-v25.10.06.zip" -DestinationPath expanded
          $executable = Join-Path $PWD "expanded/DonkeySimWin/donkey_sim.exe"
          if (!(Test-Path $executable)) {
            throw "donkey_sim.exe was not found"
          }

      - name: Run button callback validation
        shell: pwsh
        run: |
          $root = Join-Path $PWD "expanded/DonkeySimWin"
          $executable = Join-Path $root "donkey_sim.exe"
          $updater = Join-Path $env:RUNNER_TEMP "fake-donkey-sim-updater.cmd"
          $updaterLog = Join-Path $env:RUNNER_TEMP "fake-donkey-sim-updater.log"
          $unityLog = Join-Path $env:RUNNER_TEMP "donkey_sim.log"
          @'
          @echo off
          echo called args: %* >> "%RUNNER_TEMP%\fake-donkey-sim-updater.log"
          exit /b 0
          '@ | Set-Content -Path $updater

          $env:DONKEY_SIM_UPDATER = $updater
          $env:DONKEY_SIM_UPDATE_TEST = "1"
          $process = Start-Process -FilePath $executable `
            -WorkingDirectory $root `
            -ArgumentList @("--host", "127.0.0.1", "--port", "9097", "-batchmode", "-nographics", "-logFile", $unityLog) `
            -PassThru

          if (!$process.WaitForExit(120)) {
            Stop-Process -Id $process.Id -Force
            throw "simulator did not exit after update callback"
          }

          if (!(Test-Path $updaterLog)) {
            throw "fake updater was not called"
          }
          $updaterArguments = Get-Content $updaterLog -Raw
          Write-Host "Fake updater output: $updaterArguments"
          if (!$updaterArguments.Contains("--apply-after-exit --pid") -or !$updaterArguments.Contains("--restart")) {
            throw "fake updater received incorrect arguments"
          }

          if (Test-Path $unityLog) {
            Write-Host "----- Unity log -----"
            Get-Content $unityLog
          }

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-simulator-validation-logs
          path: |
            ${{ runner.temp }}/fake-donkey-sim-updater.log
            ${{ runner.temp }}/donkey_sim.log
          if-no-files-found: warn
          retention-days: 3
