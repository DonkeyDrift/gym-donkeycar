name: Windows simulator validation

on:
  push:
    branches:
      - Tony-update-source-repo
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Download validation package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          gh release download v1.4.2 `
            --repo DonkeyDrift/gym-donkeycar `
            --pattern "DonkeySimWin.zip" `
            --dir package
          $package = "package/DonkeySimWin.zip"
          if (!(Test-Path $package) -or (Get-Item $package).Length -eq 0) {
            throw "downloaded package is missing or empty"
          }

      - name: Expand validation package
        shell: pwsh
        run: |
          Expand-Archive -Path "package/DonkeySimWin.zip" -DestinationPath expanded
          $executable = Join-Path $PWD "expanded/DonkeySimWin/Donkey Sim.exe"
          if (!(Test-Path $executable)) {
            throw "Donkey Sim.exe was not found"
          }

      - name: Run update check and callback validation
        shell: pwsh
        run: |
          $root = Join-Path $PWD "expanded/DonkeySimWin"
          $executable = Join-Path $root "Donkey Sim.exe"
          $updater = Join-Path $env:RUNNER_TEMP "fake-donkey-sim-updater.cmd"
          $checkLog = Join-Path $env:RUNNER_TEMP "fake-donkey-sim-check.log"
          $updaterLog = Join-Path $env:RUNNER_TEMP "fake-donkey-sim-updater.log"
          $unityLog = Join-Path $env:RUNNER_TEMP "donkey_sim.log"
          @'
          @echo off
          if "%~1"=="check" (
            echo check args: %* >> "%RUNNER_TEMP%\fake-donkey-sim-check.log"
            echo {"check_ok":true,"update_available":true,"installed":"v1.3.1","latest":"v1.4.0","channel":"stable","source":"github"}
            exit /b 0
          )
          echo update args: %* >> "%RUNNER_TEMP%\fake-donkey-sim-updater.log"
          exit /b 0
          '@ | Set-Content -Path $updater

          $env:DONKEY_SIM_UPDATER = $updater
          $env:DONKEY_SIM_UPDATE_TEST = "1"
          $process = Start-Process -FilePath $executable `
            -WorkingDirectory $root `
            -ArgumentList @("--host", "127.0.0.1", "--port", "9097", "-batchmode", "-nographics", "-logFile", $unityLog) `
            -PassThru

          if (!$process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force
            throw "simulator did not exit after update callback"
          }

          if (!(Test-Path $checkLog)) {
            throw "fake updater check command was not called"
          }
          $checkArguments = Get-Content $checkLog -Raw
          Write-Host "Fake updater check output: $checkArguments"
          if (!$checkArguments.Contains("check --json")) {
            throw "fake updater received incorrect check arguments"
          }
          if ($checkArguments.Contains("--prerelease")) {
            throw "stable channel must not pass --prerelease"
          }

          if (!(Test-Path $updaterLog)) {
            throw "fake updater update command was not called"
          }
          $updaterArguments = Get-Content $updaterLog -Raw
          Write-Host "Fake updater update output: $updaterArguments"
          if (!$updaterArguments.Contains("--apply-after-exit --pid") -or !$updaterArguments.Contains("--restart")) {
            throw "fake updater received incorrect update arguments"
          }
          if ($updaterArguments.Contains("--prerelease")) {
            throw "stable channel must not pass --prerelease"
          }

          if (Test-Path $unityLog) {
            Write-Host "----- Unity log -----"
            Get-Content $unityLog
          }

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-simulator-validation-logs
          path: |
            ${{ runner.temp }}/fake-donkey-sim-check.log
            ${{ runner.temp }}/fake-donkey-sim-updater.log
            ${{ runner.temp }}/donkey_sim.log
          if-no-files-found: warn
          retention-days: 3
